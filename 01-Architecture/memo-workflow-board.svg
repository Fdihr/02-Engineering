<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" role="img" aria-labelledby="title description">
  <title id="title">Seerist and OSINT evidence-grounded memo workflow</title>
  <desc id="description">Canonical version 2.3 evidence-grounded memo workflow showing bounded Seerist and OSINT collection, lossless provider-neutral source documents, AI question-relevance proposals, deterministic pending-candidate validation, human evidence admission, four-goal source assurance, external claim synthesis, optional organizational context, quality verification, and human publication approval. Cyber threat intelligence is the first validated memo profile, not the product boundary.</desc>

  <defs>
    <style>
      text { font-family: "VestasSans"; letter-spacing: 0; }
      .canvas { fill: #FFFFFF; }
      .board { fill: #FFFFFF; stroke: #E3E5E8; stroke-width: 2; }
      .panel { fill: #FFFFFF; stroke: #A2A9B1; stroke-width: 1.5; }
      .panel-header { fill: #1F3144; }
      .page-title { fill: #1F3144; font-size: 32px; font-weight: 500; }
      .page-subtitle { fill: #606D7B; font-size: 14px; font-weight: 400; }
      .panel-title { fill: #FFFFFF; font-size: 18px; font-weight: 500; }
      .panel-subtitle { fill: #E3E5E8; font-size: 12px; font-weight: 400; }
      .card-title { fill: #1F3144; font-size: 15px; font-weight: 500; }
      .body { fill: #606D7B; font-size: 13px; font-weight: 400; }
      .caption { fill: #606D7B; font-size: 12px; font-weight: 400; }
      .small { fill: #606D7B; font-size: 11px; font-weight: 400; }
      .white-small { fill: #FFFFFF; font-size: 11px; font-weight: 500; }
      .det-card { fill: #FFFFFF; stroke: #005AFF; stroke-width: 2; }
      .agent-card { fill: #96C8F0; stroke: #005AFF; stroke-width: 1.5; }
      .human-card { fill: #FFFFFF; stroke: #19736E; stroke-width: 2; }
      .gate-card { fill: #FFFFFF; stroke: #772219; stroke-width: 2; }
      .context-card { fill: #FFFFFF; stroke: #E17D28; stroke-width: 2; }
      .artifact-card { fill: #E3E5E8; stroke: #A2A9B1; stroke-width: 1.5; }
      .quiet-card { fill: #FFFFFF; stroke: #A2A9B1; stroke-width: 1.5; }
      .tested-chip { fill: #19736E; }
      .warning-chip { fill: #E17D28; }
      .state-chip { fill: #772219; }
      .primary-line { fill: none; stroke: #005AFF; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .authority-line { fill: none; stroke: #E17D28; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow-orange); }
      .feedback-line { fill: none; stroke: #772219; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow-red); }
      .divider { stroke: #E3E5E8; stroke-width: 1; }
    </style>

    <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#005AFF" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#E17D28" />
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#772219" />
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="2400" height="1400" />
  <text class="page-title" x="48" y="48">Seerist + OSINT evidence-grounded memo workflow</text>
  <text class="page-subtitle" x="48" y="76">Version 2.3 | General memo core, profile-specific policy, and full source assurance</text>

  <rect class="det-card" x="1696" y="32" width="16" height="16" />
  <text class="caption" x="1720" y="45">Deterministic</text>
  <rect class="agent-card" x="1824" y="32" width="16" height="16" />
  <text class="caption" x="1848" y="45">Semantic goal</text>
  <rect class="human-card" x="1968" y="32" width="16" height="16" />
  <text class="caption" x="1992" y="45">Human gate</text>
  <rect class="context-card" x="2088" y="32" width="16" height="16" />
  <text class="caption" x="2112" y="45">Separate authority</text>

  <rect class="board" x="32" y="96" width="2336" height="1272" />

  <!-- PANEL 1: INTAKE, COLLECTION, CLASSIFICATION -->
  <rect class="panel" x="64" y="128" width="552" height="936" />
  <rect class="panel-header" x="64" y="128" width="552" height="72" />
  <text class="panel-title" x="88" y="158">1. Intent, collection, and admission</text>
  <text class="panel-subtitle" x="88" y="181">AI proposes question relevance; deterministic code and humans retain state authority</text>

  <rect class="human-card" x="88" y="224" width="504" height="112" />
  <text class="card-title" x="112" y="252">Approve scope and research questions</text>
  <text class="body" x="112" y="278">Purpose | audience | geography | time window | questions</text>
  <text class="caption" x="112" y="302">No provider call before both explicit human approvals.</text>
  <rect class="tested-chip" x="480" y="312" width="88" height="8" />

  <rect class="det-card" x="88" y="360" width="504" height="136" />
  <text class="card-title" x="112" y="388">Bounded Seerist collection</text>
  <text class="body" x="112" y="414">Discovery -> one gap-fill pass -> one lead-resolution hop</text>
  <text class="caption" x="112" y="440">Persist raw response before parsing; enforce call, time, item, and page budgets.</text>
  <text class="caption" x="112" y="464">Detect changing totals, duplicate IDs, timestamp inversions, and incomplete pages.</text>
  <rect class="tested-chip" x="480" y="488" width="88" height="8" />

  <rect class="det-card" x="88" y="520" width="504" height="184" />
  <text class="card-title" x="112" y="548">Classify every provider item</text>
  <line class="divider" x1="112" y1="564" x2="568" y2="564" />
  <text class="body" x="112" y="592">Evidence candidate</text>
  <text class="caption" x="280" y="592">Captured content + provenance -> readiness</text>
  <text class="body" x="112" y="624">Collection lead</text>
  <text class="caption" x="280" y="624">Summary, hotspot, cluster, URL -> resolve</text>
  <text class="body" x="112" y="656">Context</text>
  <text class="caption" x="280" y="656">Pulse, risk, background, future -> orient</text>
  <text class="small" x="112" y="684">Endpoint + source type + content depth + lineage determine role.</text>
  <rect class="tested-chip" x="480" y="696" width="88" height="8" />

  <rect class="det-card" x="88" y="728" width="504" height="88" />
  <text class="card-title" x="112" y="756">Resolve + canonicalize source</text>
  <text class="body" x="112" y="784">One source hop | lossless document | stable hash anchors</text>
  <rect class="tested-chip" x="480" y="808" width="88" height="8" />

  <rect class="agent-card" x="88" y="836" width="504" height="96" />
  <text class="card-title" x="112" y="864">AI question-relevance proposal</text>
  <text class="body" x="112" y="890">Relevant | partial | not relevant | uncertain</text>
  <text class="caption" x="112" y="914">Code validates lineage and exact anchors; AI has no approval authority.</text>
  <rect class="tested-chip" x="480" y="924" width="88" height="8" />

  <rect class="human-card" x="88" y="952" width="504" height="88" />
  <text class="card-title" x="112" y="980">Human evidence admission</text>
  <text class="body" x="112" y="1006">Review anchored proposal | approve | reject | revise</text>
  <text class="caption" x="112" y="1028">Only approved candidates enter source assurance.</text>
  <rect class="tested-chip" x="480" y="1032" width="88" height="8" />

  <path class="primary-line" d="M 340 336 L 340 358" />
  <path class="primary-line" d="M 340 496 L 340 518" />
  <path class="primary-line" d="M 340 704 L 340 726" />
  <path class="primary-line" d="M 340 816 L 340 834" />
  <path class="primary-line" d="M 340 932 L 340 950" />
  <path class="feedback-line" d="M 88 772 L 48 772 L 48 612 L 86 612" />

  <!-- PANEL 2: FOUR-GOAL SOURCE ASSURANCE -->
  <rect class="panel" x="640" y="128" width="704" height="936" />
  <rect class="panel-header" x="640" y="128" width="704" height="72" />
  <text class="panel-title" x="664" y="158">2. Stage-owned source assurance</text>
  <text class="panel-subtitle" x="664" y="181">Four bounded, controller-owned goal loops preserve semantic and audit checks</text>

  <rect class="artifact-card" x="664" y="224" width="656" height="64" />
  <text class="card-title" x="688" y="250">Approved evidence snapshot + canonical source</text>
  <text class="caption" x="688" y="272">Complete content | stable anchors | provenance | permitted claim kinds | limitations</text>

  <rect class="agent-card" x="664" y="320" width="312" height="136" />
  <text class="card-title" x="688" y="348">Find goal loop</text>
  <text class="body" x="688" y="374">Goal: supported atomic observations</text>
  <text class="caption" x="688" y="400">Prepare -> Act -> Observe -> Check</text>
  <text class="caption" x="688" y="424">Commit extraction for Judge</text>

  <rect class="agent-card" x="1008" y="320" width="312" height="136" />
  <text class="card-title" x="1032" y="348">Sweep goal loop</text>
  <text class="body" x="1032" y="374">Goal: independent coverage pass</text>
  <text class="caption" x="1032" y="400">Prepare -> Act -> Observe -> Check</text>
  <text class="caption" x="1032" y="424">Commit blind extraction for Judge</text>

  <rect class="agent-card" x="664" y="488" width="656" height="144" />
  <text class="card-title" x="688" y="516">Judge goal loop</text>
  <text class="body" x="688" y="542">Goal: dispose every extraction against the original source.</text>
  <text class="caption" x="688" y="568">Prepare -> Act -> Observe -> Check; retry when required conditions are unmet</text>
  <text class="caption" x="688" y="592">Commit adjudicated source brief for Write</text>
  <rect class="warning-chip" x="1208" y="608" width="88" height="8" />

  <rect class="agent-card" x="664" y="664" width="656" height="120" />
  <text class="card-title" x="688" y="692">Write goal loop</text>
  <text class="body" x="688" y="718">Goal: faithful source note from the adjudicated brief.</text>
  <text class="caption" x="688" y="744">Prepare -> Act -> Observe -> Check; commit only when no new claim is introduced</text>

  <rect class="artifact-card" x="664" y="816" width="656" height="80" />
  <text class="card-title" x="688" y="844">Typed source intelligence note</text>
  <text class="caption" x="688" y="870">Accepted observations | judgments | question coverage | caveats | gaps</text>

  <rect class="quiet-card" x="664" y="928" width="656" height="104" />
  <text class="card-title" x="688" y="956">Stage-owned deterministic controller</text>
  <text class="body" x="688" y="982">Frozen goal + conditions -> scoped call -> observation -> retry or commit</text>
  <text class="small" x="688" y="1008">Immutable attempts | bounded failure | model never chooses transition or next stage</text>

  <path class="primary-line" d="M 820 288 L 820 318" />
  <path class="primary-line" d="M 1164 288 L 1164 318" />
  <path class="primary-line" d="M 820 456 L 820 472 L 992 472 L 992 486" />
  <path class="primary-line" d="M 1164 456 L 1164 472 L 992 472 L 992 486" />
  <path class="primary-line" d="M 992 632 L 992 662" />
  <path class="primary-line" d="M 992 784 L 992 814" />

  <!-- Approved evidence enters source assurance. -->
  <path class="primary-line" d="M 592 948 L 628 948 L 628 256 L 662 256" />

  <!-- PANEL 3: SYNTHESIS, CONTEXT, STANDARD, OUTPUT -->
  <rect class="panel" x="1368" y="128" width="968" height="936" />
  <rect class="panel-header" x="1368" y="128" width="968" height="72" />
  <text class="panel-title" x="1392" y="158">3. Synthesis, relevance, quality, and publication</text>
  <text class="panel-subtitle" x="1392" y="181">External facts first; Vestas context and memo standards remain separate authorities</text>

  <rect class="agent-card" x="1392" y="224" width="272" height="112" />
  <text class="card-title" x="1416" y="252">Build</text>
  <text class="body" x="1416" y="278">Atomic external claims</text>
  <text class="caption" x="1416" y="302">Support | conflicts | dependencies</text>

  <rect class="gate-card" x="1688" y="224" width="272" height="112" />
  <text class="card-title" x="1712" y="252">Challenge</text>
  <text class="body" x="1712" y="278">Attack false corroboration</text>
  <text class="caption" x="1712" y="302">Alternatives | gaps | inflation</text>

  <rect class="agent-card" x="1984" y="224" width="328" height="112" />
  <text class="card-title" x="2008" y="252">Adjudicate</text>
  <text class="body" x="2008" y="278">Resolve every challenge</text>
  <text class="caption" x="2008" y="302">Seal accepted, contested, rejected</text>

  <path class="primary-line" d="M 1664 280 L 1686 280" />
  <path class="primary-line" d="M 1960 280 L 1982 280" />

  <rect class="artifact-card" x="1392" y="360" width="920" height="72" />
  <text class="card-title" x="1416" y="388">Adjudicated external claim graph</text>
  <text class="caption" x="1416" y="412">Claim-to-observation lineage | source relationships | confidence | contradictions | gaps</text>
  <path class="primary-line" d="M 2148 336 L 2148 358" />

  <rect class="context-card" x="1392" y="464" width="280" height="112" />
  <text class="card-title" x="1416" y="492">Provider context</text>
  <text class="body" x="1416" y="518">Pulse | ratings | background</text>
  <text class="caption" x="1416" y="542">Attributed orientation only</text>

  <rect class="context-card" x="1696" y="464" width="280" height="112" />
  <text class="card-title" x="1720" y="492">Organizational context pack</text>
  <text class="body" x="1720" y="518">Footprint | assets | dependencies</text>
  <text class="caption" x="1720" y="542">Governed, valid, classified</text>

  <rect class="context-card" x="2000" y="464" width="312" height="112" />
  <text class="card-title" x="2024" y="492">Memo standard pack</text>
  <text class="body" x="2024" y="518">Structure | voice | confidence</text>
  <text class="caption" x="2024" y="542">Old memos set standard, never facts</text>

  <rect class="agent-card" x="1392" y="608" width="584" height="120" />
  <text class="card-title" x="1416" y="636">Organizational relevance</text>
  <text class="body" x="1416" y="662">External claim + governed context -> exposure and consequence pathways</text>
  <text class="caption" x="1416" y="688">Every implication needs dual lineage; unknown remains an explicit gap.</text>

  <rect class="agent-card" x="2000" y="608" width="312" height="120" />
  <text class="card-title" x="2024" y="636">Memo writer</text>
  <text class="body" x="2024" y="662">Evidence + relevance + standard</text>
  <text class="caption" x="2024" y="688">Canonical JSON first</text>

  <path class="authority-line" d="M 1532 576 L 1532 606" />
  <path class="authority-line" d="M 1836 576 L 1836 606" />
  <path class="primary-line" d="M 1684 432 L 1684 606" />
  <path class="authority-line" d="M 2156 576 L 2156 606" />
  <path class="primary-line" d="M 1976 668 L 1998 668" />

  <rect class="artifact-card" x="1392" y="760" width="920" height="72" />
  <text class="card-title" x="1416" y="788">Draft memo vN</text>
  <text class="caption" x="1416" y="812">Claim-level citations | dual-lineage implications | standard version | limitations | gaps</text>
  <path class="primary-line" d="M 2156 728 L 2156 758" />

  <rect class="det-card" x="1392" y="864" width="584" height="144" />
  <text class="card-title" x="1416" y="892">Deterministic + independent quality verification</text>
  <text class="body" x="1416" y="918">Fidelity | citations | independence | calibration | alternatives | relevance</text>
  <text class="caption" x="1416" y="944">No weighted score: one blocking authority failure blocks publication review.</text>
  <text class="small" x="1416" y="976">Maximum two revision cycles; unresolved findings escalate.</text>

  <rect class="human-card" x="2000" y="864" width="312" height="144" />
  <text class="card-title" x="2024" y="892">Human publication gate</text>
  <text class="body" x="2024" y="918">Approve | reject | targeted revision</text>
  <text class="caption" x="2024" y="944">Only a human can approve.</text>
  <text class="small" x="2024" y="976">Prior versions remain immutable.</text>
  <rect class="tested-chip" x="2200" y="984" width="88" height="8" />

  <path class="primary-line" d="M 1852 832 L 1852 862" />
  <path class="primary-line" d="M 1976 936 L 1998 936" />
  <path class="feedback-line" d="M 2156 864 L 2156 840 L 2336 840 L 2336 668 L 2314 668" />

  <!-- Source notes enter external synthesis. -->
  <path class="primary-line" d="M 1320 856 L 1352 856 L 1352 280 L 1390 280" />

  <!-- FOUNDATION -->
  <rect class="panel" x="64" y="1088" width="2272" height="248" />
  <rect class="panel-header" x="64" y="1088" width="2272" height="56" />
  <text class="panel-title" x="88" y="1123">4. Trust and implementation foundation</text>
  <text class="panel-subtitle" x="480" y="1123">Explicit authorities, typed artifacts, deterministic transitions, and incremental delivery</text>

  <rect class="quiet-card" x="88" y="1168" width="520" height="144" />
  <text class="card-title" x="112" y="1196">Three authorities never substitute</text>
  <text class="body" x="112" y="1222">Evidence</text>
  <text class="caption" x="208" y="1222">what happened</text>
  <text class="body" x="112" y="1248">Vestas context</text>
  <text class="caption" x="208" y="1248">why it matters</text>
  <text class="body" x="112" y="1274">Memo standard</text>
  <text class="caption" x="208" y="1274">how it is communicated</text>

  <rect class="det-card" x="632" y="1168" width="520" height="144" />
  <text class="card-title" x="656" y="1196">Code owns control</text>
  <text class="body" x="656" y="1222">State | permissions | budgets | retries | validation</text>
  <text class="caption" x="656" y="1248">Model output proposes artifacts; it never advances state.</text>
  <text class="caption" x="656" y="1274">Raw inputs and every accepted claim remain traceable.</text>

  <rect class="gate-card" x="1176" y="1168" width="520" height="144" />
  <text class="card-title" x="1200" y="1196">Non-negotiable quality blockers</text>
  <text class="body" x="1200" y="1222">Unsupported claim | bad citation | hidden dependency</text>
  <text class="caption" x="1200" y="1248">No context-only corroboration or historical-fact leakage.</text>
  <text class="caption" x="1200" y="1274">No confidence inflation or suppressed contradiction.</text>

  <rect class="det-card" x="1720" y="1168" width="592" height="144" />
  <text class="card-title" x="1744" y="1196">Current implementation slice</text>
  <text class="body" x="1744" y="1222">Scope -> question -> collect -> canonicalize -> relevance -> candidate</text>
  <text class="caption" x="1744" y="1248">Panel 1 complete: approved NV snapshot is ready for source assurance.</text>
  <text class="caption" x="1744" y="1274">Scale only after each behavior works and is measured.</text>
</svg>