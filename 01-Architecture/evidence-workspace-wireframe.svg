<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title description">
  <title id="title">Proposed Evidence workspace desktop layout</title>
  <desc id="description">Illustrative target screen with question navigation on the left, grounded evidence in the centre and an exception panel on the right. A separate lower panel shows the current source acquisition blocker. All target counts and observations are fictional layout examples, not analysis results.</desc>
  <style>
    text { font-family:"Vestas Sans",Arial,sans-serif; fill:#1f3144; font-size:15px; }
    .small { font-size:13px; }
    .muted { fill:#606d7b; }
    .white { fill:#fff; }
    .link { fill:#005aff; }
    .heading { font-size:24px; font-weight:400; }
    .subheading { font-size:18px; font-weight:500; }
    .strong { font-weight:600; }
    .rule { stroke:#e3e5e8; stroke-width:1; }
    .control { fill:#fff; stroke:#88929c; rx:4; }
    .caution { fill:#7a5a00; }
  </style>
  <rect width="1440" height="1160" fill="#f1f2f3"/>
  <text x="32" y="31" class="strong">DESIGN PROPOSAL</text>
  <text x="202" y="31" class="muted">Desktop composition / illustrative target data / not a live analysis or implemented capability</text>
  <rect x="24" y="52" width="1392" height="876" fill="#fff" stroke="#c7ccd0"/>
  <rect x="24" y="52" width="1392" height="56" fill="#1f3144"/>
  <text x="48" y="87" class="white strong">CTI workbench</text>
  <text x="230" y="87" class="white">Home</text>
  <text x="310" y="87" class="white">New analysis</text>
  <text x="442" y="87" class="white">Audit</text>
  <text x="516" y="87" class="white">Settings</text>
  <text x="1088" y="87" class="white small">Analysis: example-memo</text>
  <text x="1300" y="87" class="white small">Account</text>

  <text x="52" y="151" class="heading">Evidence</text>
  <text x="52" y="179" class="muted">Approved question: Which disruptions pose the greatest risk to manufacturing operations?</text>
  <text x="52" y="216" class="muted">Intent</text>
  <text x="138" y="216" class="link strong">Evidence</text>
  <text x="248" y="216" class="muted">Findings</text>
  <text x="346" y="216" class="muted">Writing</text>
  <text x="438" y="216" class="muted">Publication</text>
  <path d="M138 230H207" stroke="#005aff" stroke-width="2"/>
  <text x="1092" y="216" class="link">Question coverage</text>
  <text x="1250" y="216" class="muted">Source explorer</text>
  <path d="M52 231H1388" class="rule"/>

  <rect x="52" y="250" width="1336" height="76" fill="#f8f9f9"/>
  <circle cx="72" cy="273" r="4" fill="#005aff"/>
  <text x="86" y="278" class="strong">Processing within approved scope</text>
  <text x="72" y="305" class="muted small">184 collected / 42 assessed / 18 admitted / 6 in processing</text>
  <text x="756" y="278">Next: independent reporting for supply-chain gaps</text>
  <text x="756" y="305" class="muted small">Model calls: 24 / 60 approved limit. Stage counts may overlap.</text>
  <rect x="1292" y="268" width="76" height="36" class="control"/>
  <text x="1309" y="291">Pause</text>

  <path d="M334 350V898M1090 350V898" class="rule"/>
  <text x="52" y="370" class="subheading">Research questions</text>
  <text x="52" y="397" class="muted small">Coverage, not a confidence score</text>
  <rect x="40" y="418" width="278" height="108" fill="#e5f1fb"/>
  <text x="56" y="447" class="strong">Physical and hybrid disruption</text>
  <text x="56" y="473" class="small">Evidence on both sides</text>
  <text x="56" y="500" class="muted small">6 admitted sources / 3 origin groups</text>
  <text x="56" y="561" class="strong">Cyber disruption</text>
  <text x="56" y="588" class="muted small">Support found / counterevidence gap</text>
  <path d="M56 610H302" class="rule"/>
  <text x="56" y="644" class="strong">Supply-chain disruption</text>
  <text x="56" y="671" class="muted small">Limited coverage / processing next</text>
  <path d="M56 693H302" class="rule"/>
  <text x="56" y="727" class="strong">Regional spillover</text>
  <text x="56" y="754" class="muted small">Not yet assessed</text>
  <path d="M56 776H302" class="rule"/>
  <text x="56" y="810" class="strong">Economic and regulatory risk</text>
  <text x="56" y="837" class="muted small">Not yet assessed</text>
  <text x="56" y="886" class="link small">View approved research plan</text>

  <text x="362" y="370" class="subheading">Physical and hybrid disruption</text>
  <text x="362" y="399" class="muted small">Which reported incidents materially affected manufacturing operations?</text>
  <text x="362" y="443" class="strong">Provisional assessment</text>
  <text x="362" y="474">Reporting describes isolated disruptions, but does not yet establish</text>
  <text x="362" y="498">a broad increase. Attribution and operational impact remain uneven.</text>
  <text x="362" y="527" class="muted small">Illustrative wording only. Production text requires validated evidence lineage.</text>
  <path d="M362 549H1062" class="rule"/>

  <text x="362" y="582" class="strong">Supporting observations</text>
  <text x="362" y="612">A reported facility outage interrupted one production line.</text>
  <text x="362" y="640" class="link small">Open source passage</text>
  <text x="534" y="640" class="muted small">2 reports / 1 shared origin / qualified support</text>
  <path d="M362 661H1062" class="rule"/>
  <text x="362" y="694" class="strong">Contradictory observations</text>
  <text x="362" y="724">Another account reports no sustained loss of production.</text>
  <text x="362" y="752" class="link small">Compare source passages</text>
  <text x="568" y="752" class="muted small">Independent origin / unresolved difference</text>
  <path d="M362 773H1062" class="rule"/>
  <text x="362" y="806" class="strong">What is still missing</text>
  <text x="362" y="835">Comparable incident rates and verified outage duration.</text>
  <text x="362" y="863" class="muted small">System next step: prioritise primary reporting within the remaining budget.</text>
  <text x="362" y="892" class="link small">Explore linked sources, deferred items and processing history</text>

  <text x="1114" y="370" class="subheading">Needs your attention</text>
  <text x="1114" y="398" class="muted small">1 pushed exception / target state</text>
  <path d="M1114 418H1388" class="rule"/>
  <text x="1114" y="448" class="strong">Uncertain relevance</text>
  <text x="1114" y="479">A source concerns an adjacent</text>
  <text x="1114" y="503">sector; its relevance is unresolved.</text>
  <text x="1114" y="540" class="muted small">Recommendation</text>
  <text x="1114" y="568">Defer from this memo.</text>
  <text x="1114" y="596" class="muted small">Consequence: retain the source;</text>
  <text x="1114" y="617" class="muted small">do not use it to support claims.</text>
  <rect x="1114" y="640" width="182" height="36" fill="#005aff" rx="4"/>
  <text x="1132" y="663" class="white">Inspect and decide</text>
  <path d="M1114 704H1388" class="rule"/>
  <text x="1114" y="736" class="muted small">No per-source approval queue.</text>
  <text x="1114" y="763" class="muted small">An empty exception area is normal.</text>
  <text x="1114" y="814" class="link small">Processing policy and budget</text>
  <text x="1114" y="843" class="link small">Pause or amend intent</text>

  <text x="32" y="968" class="strong">CURRENT BLOCKED STATE</text>
  <text x="270" y="968" class="muted">Same layout, without invented coverage, observations or running controls</text>
  <rect x="24" y="990" width="1392" height="144" fill="#fff" stroke="#c7ccd0"/>
  <rect x="48" y="1010" width="1344" height="48" fill="#fdf4d6"/>
  <text x="64" y="1040" class="caution strong">Source acquisition blocked</text>
  <text x="332" y="1040" class="caution">184 leads collected / 0 admitted evidence / RSS source connection not implemented</text>
  <text x="64" y="1088">Research questions: not yet assessed. Collected leads are not evidence of coverage.</text>
  <text x="64" y="1114" class="muted small">One consolidated blocker. Keep all leads inspectable in Source explorer. Do not require 184 human decisions.</text>
  <text x="1192" y="1088" class="link">Explore 184 leads</text>
</svg>
