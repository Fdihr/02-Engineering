<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .panel { fill: #ffffff; stroke: #d6deeb; stroke-width: 2; }
      .title { font: 700 28px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #13233a; }
      .subtitle { font: 500 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4a5b75; }
      .zone-title { font: 700 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #13233a; }
      .lane-title { font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1b2f4f; }
      .card-title { font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #13233a; }
      .card-text { font: 500 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #34455f; }
      .small { font: 500 11px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4d5f7b; }
      .agent { fill: #efe9ff; stroke: #8b71d9; stroke-width: 1.5; }
      .det { fill: #e9f3ff; stroke: #4b8ed8; stroke-width: 1.5; }
      .data { fill: #f4f6f8; stroke: #9fb0c3; stroke-width: 1.5; }
      .human { fill: #eef9ee; stroke: #52a45f; stroke-width: 1.5; }
      .gate { fill: #fff5f5; stroke: #c93b3b; stroke-width: 2; }
      .tool { fill: #fffdf3; stroke: #cab870; stroke-width: 1.5; }
      .line { stroke: #2d4f7a; stroke-width: 2; fill: none; }
      .dash { stroke: #6e7f98; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#2d4f7a" />
    </marker>
    <marker id="dashArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6e7f98" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1060" />

  <text class="title" x="56" y="52">Threat Intelligence Memo Workflow</text>
  <text class="subtitle" x="56" y="78">Goal-based agentic loop on deterministic controls with Seerist-first intake</text>

  <rect class="panel" x="44" y="98" rx="16" ry="16" width="1712" height="780" />

  <text class="lane-title" x="64" y="136">Agent Actions</text>
  <text class="lane-title" x="64" y="292">Deterministic Control</text>
  <text class="lane-title" x="64" y="448">Data Artifacts</text>
  <text class="lane-title" x="64" y="604">Human Decisions</text>

  <line x1="52" y1="148" x2="1748" y2="148" stroke="#dbe3ef" stroke-width="1" />
  <line x1="52" y1="304" x2="1748" y2="304" stroke="#dbe3ef" stroke-width="1" />
  <line x1="52" y1="460" x2="1748" y2="460" stroke="#dbe3ef" stroke-width="1" />
  <line x1="52" y1="616" x2="1748" y2="616" stroke="#dbe3ef" stroke-width="1" />

  <rect class="agent" x="88" y="172" rx="12" ry="12" width="220" height="82" />
  <text class="card-title" x="104" y="198">Initial Problem Statement</text>
  <text class="card-text" x="104" y="220">Business question and scope</text>

  <rect class="agent" x="350" y="172" rx="12" ry="12" width="250" height="82" />
  <text class="card-title" x="366" y="198">Goal Composer</text>
  <text class="card-text" x="366" y="220">Derive research questions</text>

  <rect class="det" x="640" y="330" rx="12" ry="12" width="270" height="86" />
  <text class="card-title" x="656" y="356">Intake Planner</text>
  <text class="card-text" x="656" y="378">Build deterministic Seerist query plan</text>

  <rect class="data" x="950" y="486" rx="12" ry="12" width="270" height="86" />
  <text class="card-title" x="966" y="512">Seerist Evidence Pack</text>
  <text class="card-text" x="966" y="534">Normalized source records</text>

  <rect class="gate" x="950" y="330" rx="12" ry="12" width="270" height="86" />
  <text class="card-title" x="966" y="356">Intake Evidence Gate</text>
  <text class="card-text" x="966" y="378">Any valid sources returned?</text>

  <text class="zone-title" x="1260" y="160">Goal Loop Engine</text>
  <rect class="panel" x="1244" y="176" rx="14" ry="14" width="476" height="392" />

  <rect class="agent" x="1264" y="202" rx="10" ry="10" width="102" height="64" />
  <text class="card-title" x="1280" y="229">Find</text>
  <text class="small" x="1278" y="247">discover leads</text>

  <rect class="agent" x="1380" y="202" rx="10" ry="10" width="102" height="64" />
  <text class="card-title" x="1396" y="229">Sweep</text>
  <text class="small" x="1392" y="247">expand scan</text>

  <rect class="agent" x="1496" y="202" rx="10" ry="10" width="102" height="64" />
  <text class="card-title" x="1514" y="229">Judge</text>
  <text class="small" x="1508" y="247">verify quality</text>

  <rect class="agent" x="1612" y="202" rx="10" ry="10" width="92" height="64" />
  <text class="card-title" x="1632" y="229">Write</text>
  <text class="small" x="1624" y="247">draft claims</text>

  <rect class="det" x="1264" y="304" rx="10" ry="10" width="106" height="62" />
  <text class="card-title" x="1284" y="329">Reason</text>
  <text class="small" x="1278" y="347">plan next task</text>

  <rect class="det" x="1384" y="304" rx="10" ry="10" width="106" height="62" />
  <text class="card-title" x="1417" y="329">Act</text>
  <text class="small" x="1400" y="347">one tool call</text>

  <rect class="det" x="1504" y="304" rx="10" ry="10" width="106" height="62" />
  <text class="card-title" x="1526" y="329">Observe</text>
  <text class="small" x="1517" y="347">evidence return</text>

  <rect class="gate" x="1624" y="304" rx="10" ry="10" width="84" height="62" />
  <text class="card-title" x="1637" y="329">Check</text>
  <text class="small" x="1631" y="347">source or fail</text>

  <path class="line" marker-end="url(#arrow)" d="M 1370 335 L 1382 335" />
  <path class="line" marker-end="url(#arrow)" d="M 1490 335 L 1502 335" />
  <path class="line" marker-end="url(#arrow)" d="M 1610 335 L 1622 335" />
  <path class="line" marker-end="url(#arrow)" d="M 1624 380 L 1624 410 L 1268 410 L 1268 368" />
  <text class="small" x="1444" y="404">not met -> repeat stage</text>

  <rect class="det" x="1264" y="438" rx="10" ry="10" width="440" height="112" />
  <text class="card-title" x="1280" y="462">Stage progression</text>
  <text class="card-text" x="1280" y="484">Find done -> Sweep -> Judge -> Write</text>
  <text class="card-text" x="1280" y="505">Only evidence-backed findings move forward.</text>
  <text class="card-text" x="1280" y="526">No source means no finding.</text>

  <rect class="det" x="1264" y="646" rx="12" ry="12" width="260" height="82" />
  <text class="card-title" x="1280" y="672">Structure Agent</text>
  <text class="card-text" x="1280" y="694">Deterministic memo structure</text>

  <rect class="data" x="1560" y="646" rx="12" ry="12" width="160" height="82" />
  <text class="card-title" x="1576" y="672">Memo Draft</text>
  <text class="card-text" x="1576" y="694">ready for review</text>

  <rect class="human" x="1264" y="754" rx="12" ry="12" width="260" height="88" />
  <text class="card-title" x="1280" y="781">Human Review</text>
  <text class="card-text" x="1280" y="803">Approve or send back with notes</text>

  <rect class="gate" x="1560" y="754" rx="12" ry="12" width="160" height="88" />
  <text class="card-title" x="1580" y="781">Approval Gate</text>
  <text class="card-text" x="1576" y="803">Approved?</text>

  <rect class="data" x="1264" y="896" rx="12" ry="12" width="220" height="70" />
  <text class="card-title" x="1280" y="922">Final Memo</text>
  <text class="card-text" x="1280" y="943">published output</text>

  <rect class="data" x="1512" y="896" rx="12" ry="12" width="208" height="70" />
  <text class="card-title" x="1528" y="922">Telemetry Log</text>
  <text class="card-text" x="1528" y="943">events, checks, outcomes</text>

  <path class="line" marker-end="url(#arrow)" d="M 308 214 L 348 214" />
  <path class="line" marker-end="url(#arrow)" d="M 476 254 L 476 320 L 638 320" />
  <path class="line" marker-end="url(#arrow)" d="M 910 372 L 948 372" />
  <path class="line" marker-end="url(#arrow)" d="M 1085 416 L 1085 484" />
  <path class="line" marker-end="url(#arrow)" d="M 1085 330 L 1085 320 L 910 320" />
  <text class="small" x="914" y="314">no -> replan</text>

  <path class="line" marker-end="url(#arrow)" d="M 1220 529 L 1242 529" />
  <path class="line" marker-end="url(#arrow)" d="M 1484 687 L 1558 687" />
  <path class="line" marker-end="url(#arrow)" d="M 1640 728 L 1640 752" />
  <path class="line" marker-end="url(#arrow)" d="M 1394 842 L 1394 894" />
  <path class="line" marker-end="url(#arrow)" d="M 1640 842 L 1640 894" />
  <path class="line" marker-end="url(#arrow)" d="M 1560 798 L 1526 798" />
  <path class="line" marker-end="url(#arrow)" d="M 1526 798 L 1526 600 L 1244 600" />
  <text class="small" x="1444" y="596">no -> back to goal loop</text>

  <rect class="panel" x="44" y="890" rx="14" ry="14" width="1160" height="138" />
  <text class="zone-title" x="64" y="918">Tooling Shelf for Act Step (optional, scoped, auditable)</text>

  <rect class="tool" x="62" y="936" rx="10" ry="10" width="252" height="74" />
  <text class="card-title" x="78" y="960">Seerist API</text>
  <text class="small" x="78" y="980">primary source collection</text>
  <text class="small" x="78" y="996">read only evidence fetch</text>

  <rect class="tool" x="332" y="936" rx="10" ry="10" width="252" height="74" />
  <text class="card-title" x="348" y="960">Memo Style Memory</text>
  <text class="small" x="348" y="980">historic tone and structure hints</text>
  <text class="small" x="348" y="996">guidance only, no hard authority</text>

  <rect class="tool" x="602" y="936" rx="10" ry="10" width="252" height="74" />
  <text class="card-title" x="618" y="960">Structure Guidance Docs</text>
  <text class="small" x="618" y="980">required memo skeleton and sections</text>
  <text class="small" x="618" y="996">deterministic layout constraints</text>

  <rect class="tool" x="872" y="936" rx="10" ry="10" width="314" height="74" />
  <text class="card-title" x="888" y="960">Optional OSINT / Firebase Search</text>
  <text class="small" x="888" y="980">secondary evidence only</text>
  <text class="small" x="888" y="996">must pass source evidence checks</text>

  <path class="dash" marker-end="url(#dashArrow)" d="M 1400 366 L 1120 930" />
  <path class="dash" marker-end="url(#dashArrow)" d="M 1460 366 L 736 930" />
  <path class="dash" marker-end="url(#dashArrow)" d="M 1520 366 L 466 930" />
  <path class="dash" marker-end="url(#dashArrow)" d="M 1580 366 L 194 930" />
</svg>
