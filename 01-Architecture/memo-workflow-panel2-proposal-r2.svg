<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1480" viewBox="0 0 800 1480" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Proposed panel 2, revision 2: stage-owned source assurance, geopolitical profile</title>
  <desc id="description">Revision 2 of the proposed panel 2 for the evidence-grounded memo workflow board (v2.4 draft), re-cut for a geopolitical-first memo profile. Five bounded stages under a deterministic controller: source-driven Extract with geopolitical typed fields and a required claim kind (event, statement, assessment, forecast); blind IR-driven Sweep; code-owned Reconcile with one bounded semantic support check; single-source Assess covering reliability including alignment and interest, reporting dependency with wire-relay collapse, and per-IR coverage; and a lineage-checked Write that emits a typed source intelligence note. Out-of-IR observations are routed back to the question gate as proposed IRs. Cross-source credibility, alternatives, confidence and indicators remain in panel 3.</desc>

  <defs>
    <style>
      text { font-family: "VestasSans", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; }
      .canvas { fill: #FFFFFF; }
      .panel { fill: #FFFFFF; stroke: #A2A9B1; stroke-width: 1.5; }
      .panel-header { fill: #1F3144; }
      .panel-title { fill: #FFFFFF; font-size: 18px; font-weight: 500; }
      .panel-subtitle { fill: #E3E5E8; font-size: 12px; font-weight: 400; }
      .card-title { fill: #1F3144; font-size: 15px; font-weight: 500; }
      .inner-title { fill: #1F3144; font-size: 13px; font-weight: 500; }
      .body { fill: #606D7B; font-size: 13px; font-weight: 400; }
      .caption { fill: #606D7B; font-size: 12px; font-weight: 400; }
      .small { fill: #606D7B; font-size: 11px; font-weight: 400; }
      .det-card { fill: #FFFFFF; stroke: #005AFF; stroke-width: 2; }
      .agent-card { fill: #96C8F0; stroke: #005AFF; stroke-width: 1.5; }
      .artifact-card { fill: #E3E5E8; stroke: #A2A9B1; stroke-width: 1.5; }
      .quiet-card { fill: #FFFFFF; stroke: #A2A9B1; stroke-width: 1.5; }
      .warning-chip { fill: #E17D28; }
      .primary-line { fill: none; stroke: #005AFF; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#005AFF" />
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="800" height="1480" />

  <!-- Header row: proposal label + legend for the card types used in this panel -->
  <text class="caption" x="48" y="45">Panel 2 proposal, rev 2 | geopolitical profile | for board v2.4</text>
  <rect class="det-card" x="520" y="32" width="16" height="16" />
  <text class="caption" x="544" y="45">Deterministic</text>
  <rect class="agent-card" x="648" y="32" width="16" height="16" />
  <text class="caption" x="672" y="45">Semantic goal</text>

  <!-- PANEL 2: STAGE-OWNED SOURCE ASSURANCE -->
  <rect class="panel" x="48" y="72" width="704" height="1364" />
  <rect class="panel-header" x="48" y="72" width="704" height="72" />
  <text class="panel-title" x="72" y="102">2. Stage-owned source assurance</text>
  <text class="panel-subtitle" x="72" y="125">Geopolitical profile: two elicitations, code-owned reconciliation, single-source assessment, typed note</text>

  <!-- Input artifact -->
  <rect class="artifact-card" x="72" y="168" width="656" height="80" />
  <text class="card-title" x="96" y="196">Approved evidence snapshot + canonical source + approved IRs</text>
  <text class="caption" x="96" y="218">Complete content | stable hash anchors | provenance | permitted claim kinds | limitations</text>
  <text class="caption" x="96" y="238">IRs proposed by AI, approved at the panel 1 question gate; panel 2 cannot add or widen an IR</text>

  <!-- Extract: source-driven -->
  <rect class="agent-card" x="72" y="272" width="312" height="224" />
  <text class="card-title" x="96" y="300">Extract goal loop</text>
  <text class="body" x="96" y="324">Goal: anchored atomic observations</text>
  <text class="caption" x="96" y="344">Bottom-up from the source | chunking A</text>
  <text class="caption" x="96" y="364">Typed: actor | action | event type | date</text>
  <text class="caption" x="96" y="384">location | affected entity | anchor</text>
  <text class="small" x="96" y="404">Kind: event | statement | assessment | forecast</text>
  <text class="caption" x="96" y="424">Attribution chain: original vs relayed</text>
  <text class="caption" x="96" y="444">Prepare -> Act -> Observe -> Check</text>
  <text class="caption" x="96" y="464">Commit observations for Reconcile</text>

  <!-- Sweep: IR-driven, blind -->
  <rect class="agent-card" x="416" y="272" width="312" height="224" />
  <text class="card-title" x="440" y="300">Sweep goal loop</text>
  <text class="body" x="440" y="324">Goal: dispose every approved IR</text>
  <text class="caption" x="440" y="344">Top-down from IRs | chunking B</text>
  <text class="caption" x="440" y="364">Blind to Extract | same observation schema</text>
  <text class="caption" x="440" y="384">Same typing and claim kind as Extract</text>
  <text class="caption" x="440" y="404">covered | partial | silent | contradicted</text>
  <text class="caption" x="440" y="424">Prepare -> Act -> Observe -> Check</text>
  <text class="caption" x="440" y="444">Commit dispositions + observations</text>
  <rect class="warning-chip" x="616" y="472" width="88" height="8" />

  <!-- Reconcile: deterministic stage with one bounded semantic check inside -->
  <rect class="det-card" x="72" y="520" width="656" height="224" />
  <text class="card-title" x="96" y="548">Reconcile (code-owned)</text>
  <text class="body" x="96" y="572">Goal: dispose every observation from both passes against the canonical source</text>
  <text class="caption" x="96" y="596">Code: anchor resolves at hash | merge needs anchor overlap + same claim kind; IR tags inherited</text>
  <text class="caption" x="96" y="618">Code: schema valid | IR tags are approved IDs | untouched spans queued as residual</text>
  <rect class="agent-card" x="96" y="632" width="608" height="52" />
  <text class="inner-title" x="112" y="654">Bounded semantic check: one scoped call per observation, no memory across calls</text>
  <text class="caption" x="112" y="674">Does the anchored span support the observation? yes | no. Residual span relevant? yes | no</text>
  <text class="caption" x="96" y="706">Verdict: accepted | merged | rejected | unresolved; unresolved becomes a caveat, never dropped</text>
  <text class="caption" x="96" y="728">Commit reconciled observation set for Assess</text>

  <!-- Assess: single-source only -->
  <rect class="agent-card" x="72" y="768" width="656" height="180" />
  <text class="card-title" x="96" y="796">Assess goal loop (single-source only)</text>
  <text class="body" x="96" y="820">Goal: characterize the source, not the world</text>
  <text class="caption" x="96" y="844">Reliability: access, track record, alignment and interest (state media, funders, audience)</text>
  <text class="caption" x="96" y="866">Dependency: original vs relayed; a wire relayed by many outlets is one source</text>
  <text class="caption" x="96" y="888">Per-IR coverage (assigns IR-untagged observations; no fit = out-of-IR) | limitations</text>
  <text class="small" x="96" y="908">Excluded: information credibility, alternatives, confidence; those are cross-source judgments for panel 3</text>
  <text class="caption" x="96" y="930">Prepare -> Act -> Observe -> Check; commit source assessment for Write</text>

  <!-- Write: typed note, lineage-checked -->
  <rect class="agent-card" x="72" y="972" width="656" height="160" />
  <text class="card-title" x="96" y="1000">Write goal loop</text>
  <text class="body" x="96" y="1024">Goal: typed source note, canonical JSON first; prose is rendered from it</text>
  <text class="caption" x="96" y="1048">Every statement carries observation IDs and IR IDs; no free text without lineage</text>
  <text class="caption" x="96" y="1070">Code check: no statement without lineage | every accepted observation and IR disposition placed</text>
  <text class="caption" x="96" y="1092">Semantic check: no statement exceeds its observations; a claim kind never upgrades in prose</text>
  <text class="caption" x="96" y="1114">Commit only when both checks pass</text>

  <!-- Output artifact -->
  <rect class="artifact-card" x="72" y="1156" width="656" height="100" />
  <text class="card-title" x="96" y="1184">Typed source intelligence note</text>
  <text class="caption" x="96" y="1206">Typed observations | IR dispositions | source assessment | caveats | gaps | anchor lineage</text>
  <text class="caption" x="96" y="1226">Out-of-IR observations are kept and routed to the question gate as proposed IRs, never dropped</text>
  <text class="caption" x="96" y="1246">Single-source only: corroboration, confidence and indicators are assigned in panel 3</text>

  <!-- Controller -->
  <rect class="quiet-card" x="72" y="1280" width="656" height="132" />
  <text class="card-title" x="96" y="1308">Stage-owned deterministic controller</text>
  <text class="body" x="96" y="1332">Frozen goal + exit conditions -> scoped call -> observation -> retry or commit</text>
  <text class="small" x="96" y="1354">Exit conditions must be satisfiable by an honest negative: silent and contradicted are valid variants</text>
  <text class="small" x="96" y="1374">Retry = fresh context + deterministic failure reason only | immutable attempts | bounded failure</text>
  <text class="small" x="96" y="1394">Model never chooses the transition | ship Extract first; add Sweep only if measured misses justify it</text>

  <!-- Flow -->
  <path class="primary-line" d="M 228 248 L 228 270" />
  <path class="primary-line" d="M 572 248 L 572 270" />
  <path class="primary-line" d="M 228 496 L 228 508 L 400 508 L 400 518" />
  <path class="primary-line" d="M 572 496 L 572 508 L 400 508 L 400 518" />
  <path class="primary-line" d="M 400 744 L 400 766" />
  <path class="primary-line" d="M 400 948 L 400 970" />
  <path class="primary-line" d="M 400 1132 L 400 1154" />
</svg>
